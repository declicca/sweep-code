# Sweep — the app's full test suite on every push that changes the app (brief 01, step 2). ./deploy.sh app --go refuses
# to deploy unless the last commit that changed app/ passed. Same tools as on the Mac: app/tools/par.py (3 copies of the app, PHP 8.1 like production).
name: Tests
# Only the commits that touch the app (or this file): a website commit neither runs nor cancels the app's tests.
on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    # a fixed version: « ubuntu-latest » moves to a new Ubuntu on its own (19 Oct. 2026), which can break PHP 8.1 or Playwright's
    # system packages, and deploy.sh refuses to deploy without a passed run. Move it on purpose, after a green run on the new one.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, sqlite3, curl, mbstring
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright and Chromium
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Test suite (3 copies in parallel)
        run: python3 app/tools/par.py 3
      - name: Logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/sweep-par-*/
          retention-days: 7
