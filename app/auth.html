<style>

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#0B0B0C;--surface:#141416;--raised:#1B1B1E;--line:#26262A;--text:#F2F2F3;--muted:#9A9AA2;--gain:#4C8DFF;--loss:#D4A24C;--on:#0B0B0C;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#0B0B0C;--surface:#141416;--raised:#1B1B1E;--line:#26262A;--text:#F2F2F3;--muted:#9A9AA2;--gain:#4C8DFF;--loss:#D4A24C;--on:#0B0B0C;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:16px/1.5 'Geist',-apple-system,'SF Pro Display',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70vw 50vh at 50% -10%,color-mix(in srgb,var(--gain) 8%,transparent),transparent 70%)}
.wrap{width:100%;max-width:400px}
.lockup{display:inline-flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;margin:0 0 28px}
.lockup svg{height:34px;width:auto}
.lockup span{font-size:24px;font-weight:500;letter-spacing:-.04em;line-height:1}
.headline{font-size:28px;font-weight:500;letter-spacing:-.03em;line-height:1.2;margin:0 0 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--raised);margin-bottom:20px}
.tabs button{border:0;background:none;border-radius:999px;padding:9px 10px;font:500 14px 'Geist',sans-serif;color:var(--muted);cursor:pointer;min-height:40px}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
h1{font-size:20px;font-weight:500;margin:0 0 6px}
.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=email],input[type=password]{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:16px 'Geist',sans-serif;min-height:46px}
input:focus{outline:2px solid var(--gain);outline-offset:3px;border-color:transparent}
.row{display:flex;justify-content:space-between;align-items:baseline}
.link{background:none;border:0;padding:0;color:var(--gain);font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
.primary{width:100%;margin-top:22px;min-height:46px;border:0;border-radius:999px;background:var(--gain);color:var(--on);font:600 15px 'Geist',sans-serif;cursor:pointer}
.primary:disabled{opacity:.6;cursor:default}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13.5px;color:var(--text);line-height:1.45}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--gain);flex-shrink:0}
.check a{color:var(--gain)}
.err{color:var(--loss);font-size:13.5px;margin-top:12px;min-height:1.2em}
.ok{margin-top:14px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--gain) 12%,transparent);font-size:14px}
.help{font-size:12.5px;color:var(--muted);margin-top:6px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.foot{margin-top:22px;text-align:center;color:var(--muted);font-size:12.5px}
.foot nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-bottom:10px}
.foot a{color:var(--muted);text-decoration:none} .foot a:hover{color:var(--text)}
.signoff{opacity:.7}
:focus-visible{outline:2px solid var(--gain);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

[hidden]{display:none!important}
/* ---- layout: form + product (wide screens) ---- */
body{display:block;padding:0}
.shell{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr)}
.wrap{margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));align-self:center;animation:up .5s cubic-bezier(.32,.72,0,1) both}
.show{display:none}
@media (min-width:1080px){
  .shell{grid-template-columns:minmax(440px,1fr) minmax(0,1.25fr)}
  .wrap{max-width:420px}
  .show{display:flex;align-items:center;position:relative;overflow:hidden;border-left:1px solid var(--line);
    background:radial-gradient(80% 60% at 30% 20%,color-mix(in srgb,var(--gain) 10%,transparent),transparent 70%),var(--surface)}
  .show-in{padding:56px 0 56px 56px;width:100%}
  .pillars{list-style:none;padding:0;margin:0 0 34px;display:grid;gap:14px;max-width:440px}
  .pillars li{display:grid;grid-template-columns:28px 1fr;gap:12px;font-size:15px;color:var(--muted);animation:up .5s cubic-bezier(.32,.72,0,1) both}
  .pillars li:nth-child(2){animation-delay:.06s}.pillars li:nth-child(3){animation-delay:.12s}
  .pillars b{color:var(--text);font-weight:500;display:block}
  .pillars i{width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--gain) 14%,transparent);display:grid;place-items:center;font-style:normal;color:var(--gain);font-weight:600;font-size:13px}
  .shots{position:relative;animation:shot .9s cubic-bezier(.32,.72,0,1) .1s both}
  .shots .desk{display:block;width:118%;max-width:none;height:auto;border-radius:14px;border:1px solid var(--line);box-shadow:0 40px 90px -40px rgba(0,0,0,.7)}
  .shots .phone{position:absolute;left:-28px;bottom:-34px;width:24%;height:auto;border-radius:26px;border:6px solid #1b1b1e;box-shadow:0 30px 70px -20px rgba(0,0,0,.75);animation:shot .9s cubic-bezier(.32,.72,0,1) .3s both}
  .sample{margin:48px 0 0;font-size:12px;color:var(--muted);opacity:.7}
}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes shot{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
/* ---- trust row ---- */
.trust{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;padding:0;margin:18px 0 0;font-size:12.5px;color:var(--muted)}
.trust li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gain);margin-right:7px;vertical-align:1px}
/* ---- fields ---- */
.pw{position:relative} .pw input{padding-right:46px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:var(--muted);border-radius:10px;cursor:pointer;display:grid;place-items:center}
.eye svg{width:20px;height:20px} .eye.on{color:var(--gain)}
input.valid{border-color:color-mix(in srgb,var(--gain) 55%,var(--line))}
.primary,.tabs button,.link,.eye{transition:transform .14s cubic-bezier(.22,.8,.24,1),background .2s,opacity .2s}
.primary:active{transform:scale(.97)}
.primary.busy{position:relative;color:transparent!important}
.primary.busy::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid var(--on);border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
form{animation:none}
#f.swap{animation:up .32s cubic-bezier(.32,.72,0,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.trialpill{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:500;

.selw{position:relative} .selw::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
select{width:100%;appearance:none;-webkit-appearance:none;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px 40px 12px 14px;color:var(--text);font:16px 'Geist',sans-serif;min-height:46px}

<style>

}

  box-shadow:0 50px 90px -40px rgba(0,0,0,.75),0 0 0 1px var(--line);opacity:0;transform:perspective(900px) rotateX(10deg) translateY(28px) scale(.96);
  transition:transform 1s cubic-bezier(.32,.72,0,1),opacity .8s ease}
.peek-phone::before{content:"";position:absolute;inset:auto 10% -18px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--gain) 35%,transparent);filter:blur(28px);z-index:-1}
.peek-phone img{display:block;width:100%;height:auto;border-radius:27px;background:#0b0b0c}
.peek.in .peek-phone{opacity:1;transform:none}
.peek p{margin:16px 0 0;font-size:12.5px;color:var(--muted);opacity:.8}
.pillars-m{list-style:none;padding:0;margin:30px 0 8px;display:grid;gap:10px;text-align:left}
.pillars-m li{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--muted);line-height:1.45;
  opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .7s cubic-bezier(.32,.72,0,1)}
.pillars-m.in li{opacity:1;transform:none}
.pillars-m.in li:nth-child(2){transition-delay:.08s}.pillars-m.in li:nth-child(3){transition-delay:.16s}
.pillars-m b{display:block;color:var(--text);font-weight:500;font-size:15px;margin-bottom:2px}
.pillars-m i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:13px;color:var(--gain);background:color-mix(in srgb,var(--gain) 14%,transparent)}
@media (min-width:1080px){.peek,.pillars-m{display:none!important}}
/* entrance choreography */
@media (prefers-reduced-motion:no-preference){
  .wrap{animation:none}
  .wrap>.lockup,.wrap>.headline,.wrap>.subhead,.wrap>.card,.wrap>.trust{animation:up .7s cubic-bezier(.32,.72,0,1) both}
  .wrap>.headline{animation-delay:.05s}.wrap>.subhead{animation-delay:.1s}.wrap>.card{animation-delay:.16s}.wrap>.trust{animation-delay:.26s}
  .lockup svg line:last-child{stroke-dasharray:22;stroke-dashoffset:22;animation:wickin .8s cubic-bezier(.22,.8,.24,1) .45s forwards}
  .lockup svg rect{transform-box:fill-box;transform-origin:50% 100%;animation:bodyin .6s cubic-bezier(.34,1.56,.64,1) .2s both}
}
@keyframes wickin{to{stroke-dashoffset:0}}
@keyframes bodyin{from{transform:scaleY(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.peek-phone,.pillars-m li{opacity:1;transform:none}}
</style>

}

$('eye').addEventListener('click',()=>{const p=$('password'),c=$('confirm'),show=p.type==='password';p.type=c.type=show?'text':'password';$('eye').classList.toggle('on',show);$('eye').setAttribute('aria-label',show?'Hide password':'Show password')});
const okU=v=>/^[A-Za-z0-9_.\-]{3,32}$/.test(v),okE=v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
['username','email','password','confirm'].forEach(id=>$(id).addEventListener('input',()=>{const v=$(id).value;let ok=false;
  if(mode==='register'||mode==='forgot'){ok=id==='username'?okU(v):id==='email'?okE(v):id==='password'?v.length>=10:false}
  else if(mode==='reset'||mode==='recover'){ok=id==='password'?v.length>=10:id==='confirm'?v.length>=10&&v===$('password').value:false}
  $(id).classList.toggle('valid',ok)}));

const params=new URLSearchParams(location.search);
const RESET_TOKEN=/^[a-f0-9]{64}$/.test(params.get('reset')||'')?params.get('reset'):null;
let mode='login',reg='open',shownAt=Date.now(),rstep=1;
function show(){
  const login=mode==='login',r=mode==='register',fg=mode==='forgot',rc=mode==='recover',rs=mode==='reset';
  $('tabs').hidden=!(login||r)||reg==='closed';
  document.querySelectorAll('#tabs button').forEach(b=>{b.classList.toggle('on',b.dataset.m===mode);b.setAttribute('aria-selected',b.dataset.m===mode)});
  const title=fg?tx('forgotT'):rc?tx('recT'):rs?tx('resetT'):'';$('h').textContent=title;$('h').hidden=!title;
  $('sub').textContent=fg?tx('forgotS'):'';$('sub').hidden=!fg;
  $('userF').hidden=fg||rs||(r&&rstep===1);$('nameF').hidden=!(r&&rstep===2);$('fnhelp').textContent=tx('fnHelp');$('ulabel').textContent=login?tx('userOrEmail'):tx('username');
  $('username').autocomplete=login?'username':'username';$('uhelp').textContent=tx('uhelp');$('uhelp').hidden=!r;
  $('emailF').hidden=!((r&&rstep===1)||fg);
  $('codeF').hidden=!rc;
  $('passF').hidden=fg||(r&&rstep===2);$('plabel').textContent=(rc||rs)?tx('newpass'):tx('password');
  $('password').autocomplete=login?'current-password':'new-password';$('phelp').textContent=tx('phelp');$('phelp').hidden=login;
  $('forgotBtn').hidden=!login;
  $('confirmF').hidden=!(rc||rs);
  $('consentF').hidden=true;$('consentNote').hidden=!r;
  $('askF').hidden=true;
  $('trialpill').hidden=!(r&&TRIAL);
  $('go').textContent=login?tx('login'):r?tx('create'):fg?tx('send'):tx('save');$('go').disabled=false;
  $('err').textContent='';$('okmsg').hidden=true;
  $('alt').innerHTML=fg?`<button type="button" class="link" data-m="recover">${tx('useCode')}</button> · <button type="button" class="link" data-m="login">${tx('back')}</button>`
    :rc?`<button type="button" class="link" data-m="login">${tx('back')}</button>`
    :login&&reg!=='closed'?`${tx('newTo')} <button type="button" class="link" data-m="register">${tx('create')}</button>`
    :r&&rstep===2?`<button type="button" class="link" id="backStep">${tx('editEmail')}</button>`
    :r?`${tx('haveAcct')} <button type="button" class="link" data-m="login">${tx('login')}</button>`:'';
}
function go(m){mode=m;shownAt=Date.now();show();$('f').classList.remove('swap');void $('f').offsetWidth;$('f').classList.add('swap');document.querySelectorAll('input.valid').forEach(i=>i.classList.remove('valid'));setTimeout(()=>{const f=m==='forgot'||m==='register'&&!$('username').value?(m==='forgot'?'email':'username'):m==='reset'?'password':$('username').value?'password':'username';$(f)&&$(f).focus()},0)}
document.addEventListener('click',e=>{if(e.target.closest('#backStep')){e.preventDefault();rstep=1;show();setTimeout(()=>$('email').focus(),50);return}const b=e.target.closest('[data-m]');if(b){e.preventDefault();rstep=1;go(b.dataset.m)}});
$('forgotBtn').addEventListener('click',()=>go('forgot'));
async function post(url,body){const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'fetch'},body:JSON.stringify(body)});const d=await res.json().catch(()=>({}));return {ok:res.ok,status:res.status,d}}
const enter=()=>{location.href='/'};
$('f').addEventListener('submit',async e=>{
  e.preventDefault();const err=$('err');err.textContent='';
  const v=id=>$(id).value.trim(),pw=$('password').value;let url,body;
  if(mode==='login'){if(!v('username')||!pw){err.textContent=tx('eLogin');return}url='api/auth/login';body={username:v('username'),password:pw}}
  else if(mode==='register'&&rstep===1){
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('email'))){err.textContent=tx('eEmail');return}
    if(pw.length<10){err.textContent=tx('ePass');return}
    // the email is kept first (to follow up a sign-up that does not go through); never the password
    post('api/auth/lead',{email:v('email'),lang:L,ref:params.get('ref')||'',utm:['utm_source','utm_medium','utm_campaign'].map(k=>params.get(k)||'').join('|'),website:$('website').value}).catch(()=>{});
    // then the account right away: the trader is in; his profile is completed inside the app, before his first account
    url='api/auth/register';body={email:v('email'),password:pw,consent:true,website:$('website').value,elapsed:Date.now()-shownAt,lang:L,utm_source:params.get('utm_source')||'',utm_medium:params.get('utm_medium')||'',utm_campaign:params.get('utm_campaign')||''}}
  else if(mode==='register'){
    if(v('fullname').split(/\s+/).filter(Boolean).length<2){err.textContent=tx('eName');return}
    if(!v('username')||!v('email')||!pw){err.textContent=tx('eFill');return}
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('email'))){err.textContent=tx('eEmail');return}
    if(pw.length<10){err.textContent=tx('ePass');return}
    if(!$('consent').checked){err.textContent=tx('eConsent');return}
    url='api/auth/register';body={full_name:v('fullname'),username:v('username'),email:v('email'),password:pw,consent:true,website:$('website').value,elapsed:Date.now()-shownAt,lang:L,found_via:$('foundVia').value,found_video:$('foundVideo').value.trim(),accounts_info:v('accountsInfo')}}
  else if(mode==='forgot'){if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('email'))){err.textContent=tx('eEmail');return}url='api/auth/forgot';body={email:v('email'),lang:L}}
  else if(mode==='recover'){
    if(!v('username')||!v('code')){err.textContent=tx('eFill');return}
    if(pw.length<10){err.textContent=tx('ePass');return}if(pw!==$('confirm').value){err.textContent=tx('eMatch');return}
    url='api/auth/recover';body={username:v('username'),code:v('code'),password:pw}}
  else{if(pw.length<10){err.textContent=tx('ePass');return}if(pw!==$('confirm').value){err.textContent=tx('eMatch');return}url='api/auth/reset';body={token:RESET_TOKEN,password:pw}}
  $('go').disabled=true;$('go').classList.add('busy');
  try{
    const r=await post(url,body);
    if(r.ok){
      if(mode==='forgot'){$('okmsg').textContent=tx('sent');$('okmsg').hidden=false;$('go').disabled=false;$('go').classList.remove('busy');return}
      if(mode==='reset')history.replaceState(null,'',location.pathname);
      enter();return}
    err.textContent=srv(r.d.error)||tx('eGen',{n:r.status});
  }catch{err.textContent=tx('eNet')}
  $('go').disabled=false;$('go').classList.remove('busy');
});
let TRIAL=null;
fetch('api/auth/config',{cache:'no-store'}).then(r=>r.json()).then(d=>{reg=d.registration||'open';
  if(d.invite&&d.invite.name){TRIAL=d.invite;$('foundVia').value='friend';
    $('trialpill').innerHTML='<b>✦</b> '+(()=>{const P=d.invite.plan==='elite'?'Elite':'Pro';return [`Invited by ${d.invite.name} · ${d.invite.days} days of ${P} free`,`Invité par ${d.invite.name} · ${d.invite.days} jours ${P==='Elite'?'d’Elite':'de Pro'} offerts`,`Invitado por ${d.invite.name} · ${d.invite.days} días de ${P} gratis`][I]})().replace(/[<>&]/g,'')}
  else if(d.trial&&d.trial.days){TRIAL=d.trial;const pn={pro:'Pro',elite:'Elite'}[d.trial.plan]||'Pro';
    $('trialpill').innerHTML='<b>✦</b> '+[`${pn} free for ${d.trial.days} days · no card needed`,`${pn} gratuit pendant ${d.trial.days} jours · sans carte`,`${pn} gratis durante ${d.trial.days} días · sin tarjeta`][I]}
  start()}).catch(start);
function start(){
  if(RESET_TOKEN)return go('reset');
  const wantSignup=params.get('signup')==='1'||/register|signup/.test(location.hash);
  if(wantSignup&&reg==='closed'){go('login');$('err').textContent=tx('closed');return}
  go(wantSignup?'register':'login');
}
</script>
